* { box-sizing: border-box; }

.subtab-btn.active { background: var(--surface); border-color: var(--border-strong); color: var(--text); font-weight: 500; }
button.action {
  background: var(--bg); border: 1px solid var(--border-strong); border-radius: var(--radius);

button.action:hover { background: var(--surface); }

.note { font-size: 12px; color: var(--text-muted); }

function makeHitosPlugin(items){
  return {
    id: 'hitos' + Math.random().toString(36).slice(2),
    afterDatasetsDraw(chart){
      const ctx = chart.ctx;
      const xScale = chart.scales.x;
      const area = chart.chartArea;
      ctx.save();
      items.forEach(h => {
        const xPos = xScale.getPixelForValue(h.index);
        ctx.strokeStyle = h.color;
        ctx.setLineDash([5,4]);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(xPos, area.top + 16);
        ctx.lineTo(xPos, area.bottom);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = h.color;
        ctx.font = '600 10px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(h.label, xPos, area.top + 11);
      });
      ctx.restore();
    }
  };
}
function pointRadii(len, hitoIdx, base){
  const arr = new Array(len).fill(base);
  arr[hitoIdx] = base + 4;
  return arr;
}

function buildMonthlyReport(containerId, suffix, data, opts){
  opts = opts || {};
  const isProm = !!opts.isPromedio;
  const kpis = data.kpis;
  const kpiSuffix = isProm ? ' (prom.)' : '';
  const el = document.getElementById(containerId);
  el.innerHTML =
    (isProm ? '<p class="note" style="margin:14px 0 4px;">Cada indicador es el promedio de los meses con datos disponibles — ver la nota al final de cada sección.</p>' : '') +
    '<div class="grid" style="margin-top:' + (isProm ? '4px' : '14px') + ';">' +
      metricCard('Banco inicial' + kpiSuffix, kpis.banco_inicial) +
      metricCard('Ingresos' + kpiSuffix, kpis.ingresos_total, '#0ca30c') +
      metricCard('Egresos' + kpiSuffix, kpis.egresos_total, '#d03b3b') +
      metricCard('Banco final' + kpiSuffix, kpis.banco_final) +
      metricCard('Disponible real' + kpiSuffix, kpis.disponible_real) +
      metricCard('Cuentas por cobrar' + kpiSuffix, kpis.cxc, '#c98500') +
      metricCard('Adelantados' + kpiSuffix, kpis.adelantados) +
      metricCard('Utilidad bruta' + kpiSuffix, kpis.utilidad_bruta, '#0ca30c') +
    '</div>' +
    (isProm ? '<p class="note" style="margin:6px 0 0;">Banco, ingresos, egresos, disponible y utilidad: promedio de junio y julio 2026 (los 2 cierres contables completos). Cuentas por cobrar y adelantados: promedio de 3 cortes de cobranza (mayo, junio, julio).</p>' : '') +
    '<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:12px;" id="meters' + suffix + '"></div>' +
    '<div class="subtabbar" id="subtabbar' + suffix + '">' +
      '<button class="subtab-btn" data-sub="resumen">Resumen y gráficas</button>' +
      '<button class="subtab-btn" data-sub="detalle">Detalle de egresos</button>' +
      '<button class="subtab-btn" data-sub="estado">Generar estado de resultados</button>' +
    '</div>' +
    '<div id="subResumen' + suffix + '"></div>' +
    '<div id="subDetalle' + suffix + '"></div>' +
    '<div id="subEstado' + suffix + '"></div>';

  function meter(label, value, target, invert){
    const p = value / target * 100;
    const good = invert ? (p <= 100) : (p >= 100);
    const color = good ? '#0ca30c' : '#d03b3b';
    const bg = good ? '#e7f6e7' : '#fbe9e9';
    const width = Math.min(p, 100);
    return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">' +
      '<span style="font-size:12px;color:var(--text-secondary);">' + label + '</span>' +
      '<span style="font-size:13px;font-weight:600;color:' + color + ';">' + pct(p) + '%</span></div>' +
      '<div style="height:8px;background:' + bg + ';border-radius:4px;overflow:hidden;">' +
      '<div style="height:100%;width:' + width + '%;background:' + color + ';border-radius:4px;"></div></div>' +
      '<p style="font-size:11px;color:var(--text-muted);margin:6px 0 0;">' + fmt(value) + ' de target ' + fmt(target) + '</p></div>';
  }
  document.getElementById('meters' + suffix).innerHTML =
    meter('Disponible vs. target de fondo', kpis.disponible_real, kpis.target_disponible, false) +
    meter((isProm ? 'Cartera vencida promedio' : 'Cartera vencida') + ' vs. target', kpis.cxc, kpis.target_cxc, true);

  function hbar(canvasId, items, valueKey, labelKey){
    const sorted = [...items].filter(i => i[valueKey] > 0).sort((a,b) => b[valueKey] - a[valueKey]);
    new Chart(document.getElementById(canvasId), {
      type: 'bar',
      data: { labels: sorted.map(i => i[labelKey]), datasets: [{ data: sorted.map(i => i[valueKey]), backgroundColor: sorted.map((_,idx) => cove[idx % cove.length]), borderRadius: 4 }] },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => fmt2(ctx.parsed.x) } } },
        scales: {
          x: { ticks: { callback: (v) => fmt(v), font: { size: 11 } }, grid: { color: '#e2e0d8' } },
          y: { ticks: { font: { size: 11 } }, grid: { display: false } }
        }
      }
    });
  }

  const seccionTotales = {};
  data.egresos.forEach(e => { seccionTotales[e.seccion] = (seccionTotales[e.seccion]||0) + e.importe; });
  const seccionItems = Object.entries(seccionTotales).map(([label,value]) => ({label,value}));
  const otrosGastos = data.egresos.filter(e => e.seccion === 'Otros Gastos');
  const otrosGastosTotal = otrosGastos.reduce((s,i)=>s+i.importe,0);
  const eventualExcluidos = otrosGastos.filter(e => EVENTUALES_EXCLUIDOS.hasOwnProperty(e.sub) && e.importe > 0);
  const eventualTotales = {};
  otrosGastos.filter(e => !EVENTUALES_EXCLUIDOS.hasOwnProperty(e.sub)).forEach(e => { eventualTotales[e.sub] = (eventualTotales[e.sub]||0) + e.importe; });
  const eventualItems = Object.entries(eventualTotales).map(([label,value]) => ({label,value}));
  const eventualTotal = eventualItems.reduce((s,i)=>s+i.value,0);
  const topEventual = [...eventualItems].sort((a,b)=>b.value-a.value)[0];

  const ingresosExcluidos = data.ingresos.filter(i => INGRESOS_EXCLUIDOS.hasOwnProperty(i.label) && i.value > 0);
  const ingresosOperativos = data.ingresos.filter(i => !INGRESOS_EXCLUIDOS.hasOwnProperty(i.label) && i.value > 0);
  const ingresosOperativosTotal = ingresosOperativos.reduce((s,i)=>s+i.value,0);

  document.getElementById('subResumen' + suffix).innerHTML =
    '<div class="section-label">Ingresos por rubro</div>' +
    '<div class="grid" style="grid-template-columns:1.3fr 1fr;align-items:center;">' +
      '<div style="position:relative;height:200px;"><canvas id="chartIngresos' + suffix + '"></canvas></div>' +
      '<div><div style="position:relative;height:140px;"><canvas id="chartIngresosPie' + suffix + '"></canvas></div><div id="ingresosPieLegend' + suffix + '" style="margin-top:6px;"></div></div>' +
    '</div>' +
    ingresosExcluidos.map(i => '<div class="row-line" style="margin-top:8px;padding:8px 10px;background:var(--surface);border-radius:4px;">' +
      '<span style="color:var(--text-secondary);">' + i.label.replace('*','') + ' <span class="note">(se excluye de estas gráficas: ' + INGRESOS_EXCLUIDOS[i.label] + ')</span></span>' +
      '<span style="font-weight:600;white-space:nowrap;margin-left:10px;">' + fmt2(i.value) + '</span></div>').join('') +
    '<div class="section-label">Egresos por categoría</div>' +
    '<div class="grid" style="grid-template-columns:1.3fr 1fr;align-items:center;">' +
      '<div style="position:relative;height:160px;"><canvas id="chartEgresos' + suffix + '"></canvas></div>' +
      '<div><div style="position:relative;height:140px;"><canvas id="chartEgresosPie' + suffix + '"></canvas></div><div id="egresosPieLegend' + suffix + '" style="margin-top:6px;"></div></div>' +
    '</div>' +
    '<div class="section-label">Gastos eventuales (Otros Gastos), desglose</div>' +
    '<div class="grid" style="grid-template-columns:1.3fr 1fr;align-items:start;">' +
      '<div style="position:relative;height:160px;"><canvas id="chartEventuales' + suffix + '"></canvas></div>' +
      '<div>' +
        '<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;">' +
          '<button class="subtab-btn active" id="btnEvtVsEventual' + suffix + '" style="font-size:11px;padding:4px 8px;">% vs eventuales</button>' +
          '<button class="subtab-btn" id="btnEvtVsTotal' + suffix + '" style="font-size:11px;padding:4px 8px;">% vs total egresos</button>' +
        '</div>' +
        '<div style="position:relative;height:140px;"><canvas id="chartEventualesPie' + suffix + '"></canvas></div>' +
        '<div id="eventualesPieLegend' + suffix + '" style="margin-top:6px;"></div>' +
      '</div>' +
    '</div>' +
    eventualExcluidos.map(e => '<div class="row-line" style="margin-top:8px;padding:8px 10px;background:var(--surface);border-radius:4px;">' +
      '<span style="color:var(--text-secondary);">' + e.sub + ' <span class="note">(fuera de las gráficas: ' + EVENTUALES_EXCLUIDOS[e.sub] + ')</span></span>' +
      '<span style="font-weight:600;white-space:nowrap;margin-left:10px;">' + fmt2(e.importe) + '</span></div>').join('') +
    '<div style="margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--border);">' +
    '<p class="section-label" style="margin-top:0;">Lectura para el administrador</p>' +
    '<ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.7;">' +
    '<li>El banco final calculado (' + fmt(kpis.banco_final) + ') reconcilia exacto contra lo reportado oficialmente — diferencia $0.</li>' +
    '<li>El disponible real está ' + pct((kpis.disponible_real/kpis.target_disponible-1)*100) + '% arriba del target de fondo (' + fmt(kpis.target_disponible) + ').</li>' +
    '<li>La ' + (isProm ? 'cartera vencida promedio' : 'cartera vencida') + ' (' + fmt(kpis.cxc) + ') es ' + pct(kpis.cxc/kpis.target_cxc) + 'x el target (' + fmt(kpis.target_cxc) + ').</li>' +
    '<li>Otros Gastos representan ' + pct(otrosGastosTotal/kpis.egresos_total*100) + '% del total de egresos' + (eventualExcluidos.length ? ' (incluye renglones que no son gasto operativo real, ver arriba)' : '') + '. ' +
      (topEventual ? 'De los gastos eventuales reales (' + fmt(eventualTotal) + '), "' + topEventual.label + '" (' + fmt(topEventual.value) + ') es el mayor componente.' : '') + '</li>' +
    '</ul></div>';

  const seccionSorted = [...seccionItems].filter(i=>i.value>0).sort((a,b) => b.value - a.value);
  const eventualSorted = [...eventualItems].filter(i=>i.value>0).sort((a,b) => b.value - a.value);
  const ingresosSorted = [...ingresosOperativos].sort((a,b) => b.value - a.value);
  hbar('chartIngresos' + suffix, ingresosSorted, 'value', 'label');
  hbar('chartEgresos' + suffix, seccionSorted, 'value', 'label');
  hbar('chartEventuales' + suffix, eventualSorted, 'value', 'label');

  function buildPie(canvasId, legendId, items, denom, extraSlice){
    const existing = Chart.getChart(canvasId);
    if (existing) existing.destroy();
    const labels = items.map(i => i.label);
    const data2 = items.map(i => i.value);
    const colors = items.map((_,idx) => cove[idx % cove.length]);
    if (extraSlice){ labels.push(extraSlice.label); data2.push(extraSlice.value); colors.push('#c9c7bc'); }
    new Chart(document.getElementById(canvasId), {
      type: 'doughnut',
      data: { labels, datasets: [{ data: data2, backgroundColor: colors, borderColor: '#ffffff', borderWidth: 2 }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '55%',
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => ctx.label + ': ' + fmt2(ctx.parsed) + ' (' + pct(ctx.parsed/denom*100) + '%)' } } }
      }
    });
    document.getElementById(legendId).innerHTML = labels.map((l,idx) =>
      '<div class="row-line" style="align-items:center;"><span style="display:flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:12px;">' +
      '<span class="dot" style="background:' + colors[idx] + ';"></span>' + l + '</span>' +
      '<span style="font-weight:600;font-size:12px;">' + pct(data2[idx]/denom*100) + '%</span></div>'
    ).join('');
  }

  buildPie('chartIngresosPie' + suffix, 'ingresosPieLegend' + suffix, ingresosSorted, ingresosOperativosTotal);
  buildPie('chartEgresosPie' + suffix, 'egresosPieLegend' + suffix, seccionSorted, kpis.egresos_total);

  function renderEventualesPie(mode){
    if (mode === 'total') {
      buildPie('chartEventualesPie' + suffix, 'eventualesPieLegend' + suffix, eventualSorted, kpis.egresos_total, { label: 'Resto de egresos', value: kpis.egresos_total - eventualTotal });
    } else {
      buildPie('chartEventualesPie' + suffix, 'eventualesPieLegend' + suffix, eventualSorted, eventualTotal);
    }
    document.getElementById('btnEvtVsEventual' + suffix).classList.toggle('active', mode !== 'total');
    document.getElementById('btnEvtVsTotal' + suffix).classList.toggle('active', mode === 'total');
  }
  renderEventualesPie('eventual');
  document.getElementById('btnEvtVsEventual' + suffix).addEventListener('click', () => renderEventualesPie('eventual'));
  document.getElementById('btnEvtVsTotal' + suffix).addEventListener('click', () => renderEventualesPie('total'));

  const orden = ['Seguridad y Vigilancia','Mantenimiento','Administrativos','Otros Gastos'];
  let rows = '';
  orden.forEach(sec => {
    const items = data.egresos.filter(e => e.seccion === sec).sort((a,b) => b.importe - a.importe);
    const subtotal = items.reduce((s,i)=>s+i.importe,0);
    rows += '<tr><td colspan="3" style="background:var(--surface);font-weight:600;">' + sec + '</td></tr>';
    items.forEach(i => {
      rows += '<tr><td>' + i.desc + '</td><td style="color:var(--text-secondary);">' + i.sub + '</td><td style="text-align:right;">' + fmt2(i.importe) + '</td></tr>';
    });
    rows += '<tr><td colspan="2" style="font-weight:500;text-align:right;">Subtotal</td><td style="font-weight:500;text-align:right;">' + fmt2(subtotal) + '</td></tr>';
  });
  document.getElementById('subDetalle' + suffix).innerHTML =
    '<table><colgroup><col style="width:45%"><col style="width:30%"><col style="width:25%"></colgroup>' +
    '<thead><tr><th>Descripción</th><th>Subcategoría</th><th style="text-align:right;">Importe</th></tr></thead>' +
    '<tbody>' + rows + '</tbody>' +
    '<tfoot><tr><td colspan="2" style="font-weight:600;border-top:2px solid var(--border-strong);">Total egresos' + (isProm ? ' promedio mensual' : ' ' + data.monthLabel) + '</td>' +
    '<td style="font-weight:600;text-align:right;border-top:2px solid var(--border-strong);">' + fmt2(kpis.egresos_total) + '</td></tr></tfoot></table>' +
    '<p class="note" style="margin-top:10px;">' + data.egresos.length + ' partidas' + (isProm ? ' (promedio de las subcategorías de junio y julio 2026)' : '') + '.</p>';

  let egresosHtml = '';
  orden.forEach(sec => {
    const items = data.egresos.filter(e => e.seccion === sec);
    const sub = {};
    items.forEach(i => { sub[i.sub] = (sub[i.sub]||0) + i.importe; });
    const total = Object.values(sub).reduce((a,b)=>a+b,0);
    egresosHtml += sectionBar('Gastos de ' + sec, total);
    Object.entries(sub).sort((a,b)=>b[1]-a[1]).forEach(([label,value]) => { egresosHtml += rowLine(label, value, 12); });
  });
  let ingresosHtml = '';
  [...data.ingresos].sort((a,b)=>b.value-a.value).forEach(i => { ingresosHtml += rowLine(i.label.replace('*',''), i.value); });
  let cxcHtml = '<table style="margin-top:8px;"><colgroup><col style="width:60%"><col style="width:40%"></colgroup>' +
    '<thead><tr><th>Unidad</th><th style="text-align:right;">Adeudo</th></tr></thead><tbody>';
  data.cxcPorUnidad.forEach(u => { cxcHtml += '<tr><td>' + u.unidad + '</td><td style="text-align:right;">' + fmt2(u.monto) + '</td></tr>'; });
  cxcHtml += '</tbody><tfoot><tr><td style="font-weight:600;border-top:2px solid var(--border-strong);">Total (' + data.cxcCount + ' unidades' + (isProm ? ', corte ' + data.corteFecha : '') + ')</td>' +
    '<td style="font-weight:600;text-align:right;border-top:2px solid var(--border-strong);">' + fmt2(data.cxcCorteTotal) + '</td></tr></tfoot></table>';
  let adelHtml = '';
  data.adelantadosTop.forEach(a => { adelHtml += rowLine(a.unidad, a.monto); });

  document.getElementById('subEstado' + suffix).innerHTML =
    '<p style="font-weight:600;margin:0 0 2px;">Estado de flujo de efectivo</p>' +
    '<p class="note" style="margin:0 0 16px;">' + data.cortLabel + ' — Coto 10 Puerta Natura</p>' +
    (isProm ? '<div class="row-line" style="background:var(--surface);padding:6px 8px;border-radius:4px;margin-bottom:6px;"><span>Cuentas por cobrar — promedio 3 meses (mayo-julio)</span><span style="font-weight:600;">' + fmt2(kpis.cxc) + '</span></div>' +
      '<div class="row-line" style="background:var(--surface);padding:6px 8px;border-radius:4px;margin-bottom:10px;"><span>Adelantados — promedio 3 meses (mayo-julio)</span><span style="font-weight:600;">' + fmt2(kpis.adelantados) + '</span></div>' : '') +
    rowLine('Saldo inicial', kpis.banco_inicial) +
    sectionBar('(+) Ingresos', kpis.ingresos_total) + ingresosHtml +
    sectionBar('(-) Egresos', kpis.egresos_total) + egresosHtml +
    highlightBar('(=) Saldo en bancos', kpis.banco_final) +
    '<p class="section-label">Pendientes por pagar a proveedores</p>' +
    '<p style="font-size:12px;color:var(--text-secondary);">Confirmado: $0.00. No hay pagos pendientes a proveedores' + (isProm ? '' : (' al cierre de ' + data.monthLabel)) + '.</p>' +
    '<p class="section-label">Créditos diferidos / adelantados (top 5 de ' + data.adelCount + ' unidades' + (isProm ? ', corte ' + data.corteFecha : '') + ')</p>' +
    adelHtml + rowLine('Total adelantados (' + data.adelCount + ' unidades' + (isProm ? ', corte ' + data.corteFecha : '') + ')', data.adelCorteTotal) +
    highlightBar('(=) Disponible a la fecha', kpis.disponible_real) +
    '<p class="section-label">Cuentas por cobrar (' + data.cxcCount + ' unidades' + (isProm ? ', corte más reciente: ' + data.corteFecha : '') + ')</p>' +
    cxcHtml;

  const subPanels = { resumen: document.getElementById('subResumen' + suffix), detalle: document.getElementById('subDetalle' + suffix), estado: document.getElementById('subEstado' + suffix) };
  const subBtns = document.querySelectorAll('#subtabbar' + suffix + ' .subtab-btn');
  function showSub(name){
    Object.keys(subPanels).forEach(k => subPanels[k].style.display = (k === name) ? '' : 'none');
    subBtns.forEach(b => b.classList.toggle('active', b.dataset.sub === name));
  }
  subBtns.forEach(b => b.addEventListener('click', () => showSub(b.dataset.sub)));
  showSub('resumen');
}
buildMonthlyReport('panelJunio', 'Jun', datasetJunio);
buildMonthlyReport('panelJulio', 'Jul', datasetJulio);
buildMonthlyReport('panelTodoMount', 'Todo', datasetTodo, { isPromedio: true });

const monthPanels = { resumen: document.getElementById('panelResumenGeneral'), todo: document.getElementById('panelTodo'), balance: document.getElementById('panelBalance'), junio: document.getElementById('panelJunio'), julio: document.getElementById('panelJulio') };
const monthBtns = document.querySelectorAll('#monthTabs .tab-btn');
function showMonth(name){
  Object.keys(monthPanels).forEach(k => monthPanels[k].style.display = (k === name) ? '' : 'none');
  monthBtns.forEach(b => b.classList.toggle('active', b.dataset.month === name));
}
monthBtns.forEach(b => b.addEventListener('click', () => showMonth(b.dataset.month)));
showMonth('resumen');
</script>
</body>
</html>
