* { box-sizing: border-box; }

.tabbar { display: flex; gap: 8px; margin: 18px 0 16px; flex-wrap: wrap; }
.tab-btn {

  padding: 8px 14px; font-size: 13px; font-weight: 500; color: var(--text-secondary); cursor: pointer;

.tab-btn.active { background: var(--bg); border-color: var(--accent); color: var(--accent); }
.badge { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 10px; text-transform: uppercase; }
.badge-complete { background: var(--success-bg); color: var(--success); }
.badge-partial { background: var(--warning-bg); color: var(--warning); }
.badge-pending { background: var(--border); color: var(--text-secondary); }
.subtabbar { display: flex; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
.subtab-btn {
  background: transparent; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 6px 12px; font-size: 12px; color: var(--text-secondary); cursor: pointer;
}
.subtab-btn.active { background: var(--surface); border-color: var(--border-strong); color: var(--text); font-weight: 500; }
button.action {
  background: var(--bg); border: 1px solid var(--border-strong); border-radius: var(--radius);
  padding: 8px 14px; font-size: 13px; color: var(--text); cursor: pointer;
}
button.action:hover { background: var(--surface); }
.pending-panel { background: var(--warning-bg); border: 1px solid #f0d9a8; border-radius: 12px; padding: 1rem 1.15rem; margin-top: 10px; }
.note { font-size: 12px; color: var(--text-muted); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 6px; font-size: 11px; color: var(--text-muted); border-bottom: 1px solid var(--border); font-weight: 500; }
td { padding: 5px 6px; font-size: 12px; border-bottom: 1px solid var(--border); }
.section-label { font-size: 12px; color: var(--text-secondary); margin: 18px 0 8px; }

  return '<div class="card"><p class="metric-label">' + label + '</p>' +
    '<p class="metric-value" style="' + (color ? 'color:'+color+';' : '') + '">' + fmt(value) + '</p></div>';

  const kpiSuffix = isProm ? ' (prom.)' : '';
  const el = document.getElementById(containerId);
  el.innerHTML =
    (isProm ? '<p class="note" style="margin:14px 0 4px;">Cada indicador usa el promedio de los meses con datos disponibles a la fecha — ver la nota al final de cada sección.</p>' : '') +
    '<div class="grid" style="margin-top:' + (isProm ? '4px' : '14px') + ';">' +
      metricCard('Banco inicial' + kpiSuffix, kpisJunio.banco_inicial) +
      metricCard('Ingresos' + kpiSuffix, kpisJunio.ingresos_total, '#0ca30c') +
      metricCard('Egresos' + kpiSuffix, kpisJunio.egresos_total, '#d03b3b') +
      metricCard('Banco final' + kpiSuffix, kpisJunio.banco_final) +
      metricCard('Disponible real' + kpiSuffix, kpisJunio.disponible_real) +
      metricCard(cxcLabel, cxcValue, '#c98500') +
      metricCard(adelLabel, adelValue) +
      metricCard('Utilidad bruta' + kpiSuffix, kpisJunio.utilidad_bruta, '#0ca30c') +
    '</div>' +
    (isProm ? '<p class="note" style="margin:6px 0 0;">Banco, ingresos, egresos, disponible y utilidad: promedio de 1 mes (junio 2026, único cierre contable completo). Cuentas por cobrar y adelantados: promedio de 3 cortes de cobranza (mayo, junio, julio).</p>' : '') +
    '<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:12px;" id="meters' + suffix + '"></div>' +
    '<div class="subtabbar" id="subtabbar' + suffix + '">' +
      '<button class="subtab-btn" data-sub="resumen">Resumen y gráficas</button>' +
      '<button class="subtab-btn" data-sub="detalle">Detalle de egresos</button>' +
      '<button class="subtab-btn" data-sub="estado">Generar estado de resultados</button>' +
    '</div>' +
    '<div id="subResumen' + suffix + '"></div>' +
    '<div id="subDetalle' + suffix + '"></div>' +
    '<div id="subEstado' + suffix + '"></div>';

  function meter(label, value, target, invert){
    const p = value / target * 100;
    const good = invert ? (p <= 100) : (p >= 100);
    const color = good ? '#0ca30c' : '#d03b3b';
    const bg = good ? '#e7f6e7' : '#fbe9e9';
    const width = Math.min(p, 100);
    return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">' +
      '<span style="font-size:12px;color:var(--text-secondary);">' + label + '</span>' +
      '<span style="font-size:13px;font-weight:600;color:' + color + ';">' + pct(p) + '%</span></div>' +
      '<div style="height:8px;background:' + bg + ';border-radius:4px;overflow:hidden;">' +
      '<div style="height:100%;width:' + width + '%;background:' + color + ';border-radius:4px;"></div></div>' +
      '<p style="font-size:11px;color:var(--text-muted);margin:6px 0 0;">' + fmt(value) + ' de target ' + fmt(target) + '</p></div>';
  }
  document.getElementById('meters' + suffix).innerHTML =
    meter('Disponible vs. target de fondo', kpisJunio.disponible_real, kpisJunio.target_disponible, false) +
    meter((isProm ? 'Cartera vencida promedio' : 'Cartera vencida') + ' vs. target', cxcValue, kpisJunio.target_cxc, true);

  function hbar(canvasId, items, valueKey, labelKey){
    const sorted = [...items].sort((a,b) => b[valueKey] - a[valueKey]);
    new Chart(document.getElementById(canvasId), {
      type: 'bar',
      data: { labels: sorted.map(i => i[labelKey]), datasets: [{ data: sorted.map(i => i[valueKey]), backgroundColor: sorted.map((_,idx) => cove[idx % cove.length]), borderRadius: 4 }] },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => fmt2(ctx.parsed.x) } } },
        scales: {
          x: { ticks: { callback: (v) => fmt(v), font: { size: 11 } }, grid: { color: '#e2e0d8' } },
          y: { ticks: { font: { size: 11 } }, grid: { display: false } }
        }
      }
    });
  }

  const seccionTotales = {};
  egresosJunio.forEach(e => { seccionTotales[e.seccion] = (seccionTotales[e.seccion]||0) + e.importe; });
  const seccionItems = Object.entries(seccionTotales).map(([label,value]) => ({label,value}));
  const otrosGastos = egresosJunio.filter(e => e.seccion === 'Otros Gastos');
  const otrosGastosTotal = otrosGastos.reduce((s,i)=>s+i.importe,0);
  const RETORNO_SUB = 'No es gasto - Retorno garantías';
  const retornoGarantias = otrosGastos.filter(e => e.sub === RETORNO_SUB).reduce((s,i)=>s+i.importe,0);
  const eventualTotales = {};
  otrosGastos.filter(e => e.sub !== RETORNO_SUB).forEach(e => { eventualTotales[e.sub] = (eventualTotales[e.sub]||0) + e.importe; });
  const eventualItems = Object.entries(eventualTotales).map(([label,value]) => ({label,value}));
  const eventualTotal = eventualItems.reduce((s,i)=>s+i.value,0);
  const inversionTotal = eventualTotales['Inversión'] || 0;

  document.getElementById('subResumen' + suffix).innerHTML =
    '<div class="section-label">Ingresos por rubro</div><div style="position:relative;height:220px;"><canvas id="chartIngresos' + suffix + '"></canvas></div>' +
    '<div class="section-label">Egresos por categoría</div>' +
    '<div class="grid" style="grid-template-columns:1.3fr 1fr;align-items:center;">' +
      '<div style="position:relative;height:160px;"><canvas id="chartEgresos' + suffix + '"></canvas></div>' +
      '<div><div style="position:relative;height:140px;"><canvas id="chartEgresosPie' + suffix + '"></canvas></div><div id="egresosPieLegend' + suffix + '" style="margin-top:6px;"></div></div>' +
    '</div>' +
    '<div class="section-label">Gastos eventuales (Otros Gastos), desglose</div>' +
    '<div class="grid" style="grid-template-columns:1.3fr 1fr;align-items:start;">' +
      '<div style="position:relative;height:160px;"><canvas id="chartEventuales' + suffix + '"></canvas></div>' +
      '<div>' +
        '<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;">' +
          '<button class="subtab-btn active" id="btnEvtVsEventual' + suffix + '" style="font-size:11px;padding:4px 8px;">% vs eventuales</button>' +
          '<button class="subtab-btn" id="btnEvtVsTotal' + suffix + '" style="font-size:11px;padding:4px 8px;">% vs total egresos</button>' +
        '</div>' +
        '<div style="position:relative;height:140px;"><canvas id="chartEventualesPie' + suffix + '"></canvas></div>' +
        '<div id="eventualesPieLegend' + suffix + '" style="margin-top:6px;"></div>' +
      '</div>' +
    '</div>' +
    '<div class="row-line" style="margin-top:8px;padding:8px 10px;background:var(--surface);border-radius:4px;">' +
      '<span style="color:var(--text-secondary);">Retorno de garantías de terraza <span class="note">(fuera de las gráficas: no es un gasto operativo, es devolución de un depósito)</span></span>' +
      '<span style="font-weight:600;white-space:nowrap;margin-left:10px;">' + fmt2(retornoGarantias) + '</span>' +
    '</div>' +
    '<div style="margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--border);">' +
    '<p class="section-label" style="margin-top:0;">Lectura para el administrador</p>' +
    '<ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.7;">' +
    '<li>El banco final calculado (' + fmt(kpisJunio.banco_final) + ') reconcilia exacto contra lo reportado oficialmente — diferencia $0.</li>' +
    '<li>El disponible real está ' + pct((kpisJunio.disponible_real/kpisJunio.target_disponible-1)*100) + '% arriba del target de fondo (' + fmt(kpisJunio.target_disponible) + ').</li>' +
    '<li>La ' + (isProm ? 'cartera vencida promedio' : 'cartera vencida') + ' (' + fmt(cxcValue) + ') es ' + pct(cxcValue/kpisJunio.target_cxc) + 'x el target (' + fmt(kpisJunio.target_cxc) + ').</li>' +
    '<li>Otros Gastos representan ' + pct(otrosGastosTotal/kpisJunio.egresos_total*100) + '% del total de egresos (incluye el retorno de garantías, que no es gasto operativo). De los gastos eventuales reales (' + fmt(eventualTotal) + '), Inversión en la oficina de administración (' + fmt(inversionTotal) + ') es el mayor componente, no recurrente.</li>' +
    '</ul></div>';

  const seccionSorted = [...seccionItems].sort((a,b) => b.value - a.value);
  const eventualSorted = [...eventualItems].sort((a,b) => b.value - a.value);
  hbar('chartIngresos' + suffix, ingresosJunio, 'value', 'label');
  hbar('chartEgresos' + suffix, seccionSorted, 'value', 'label');
  hbar('chartEventuales' + suffix, eventualSorted, 'value', 'label');

  function buildPie(canvasId, legendId, items, denom, extraSlice){
    const existing = Chart.getChart(canvasId);
    if (existing) existing.destroy();
    const labels = items.map(i => i.label);
    const data = items.map(i => i.value);
    const colors = items.map((_,idx) => cove[idx % cove.length]);
    if (extraSlice){ labels.push(extraSlice.label); data.push(extraSlice.value); colors.push('#c9c7bc'); }
    new Chart(document.getElementById(canvasId), {
      type: 'doughnut',
      data: { labels, datasets: [{ data, backgroundColor: colors, borderColor: '#ffffff', borderWidth: 2 }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '55%',
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => ctx.label + ': ' + fmt2(ctx.parsed) + ' (' + pct(ctx.parsed/denom*100) + '%)' } } }
      }
    });
    document.getElementById(legendId).innerHTML = labels.map((l,idx) =>
      '<div class="row-line" style="align-items:center;"><span style="display:flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:12px;">' +
      '<span class="dot" style="background:' + colors[idx] + ';"></span>' + l + '</span>' +
      '<span style="font-weight:600;font-size:12px;">' + pct(data[idx]/denom*100) + '%</span></div>'
    ).join('');
  }

  buildPie('chartEgresosPie' + suffix, 'egresosPieLegend' + suffix, seccionSorted, kpisJunio.egresos_total);

  function renderEventualesPie(mode){
    if (mode === 'total') {
      buildPie('chartEventualesPie' + suffix, 'eventualesPieLegend' + suffix, eventualSorted, kpisJunio.egresos_total, { label: 'Resto de egresos', value: kpisJunio.egresos_total - eventualTotal });
    } else {
      buildPie('chartEventualesPie' + suffix, 'eventualesPieLegend' + suffix, eventualSorted, eventualTotal);
    }
    document.getElementById('btnEvtVsEventual' + suffix).classList.toggle('active', mode !== 'total');
    document.getElementById('btnEvtVsTotal' + suffix).classList.toggle('active', mode === 'total');
  }
  renderEventualesPie('eventual');
  document.getElementById('btnEvtVsEventual' + suffix).addEventListener('click', () => renderEventualesPie('eventual'));
  document.getElementById('btnEvtVsTotal' + suffix).addEventListener('click', () => renderEventualesPie('total'));

  const orden = ['Seguridad y Vigilancia','Mantenimiento','Administrativos','Otros Gastos'];
  let rows = '';
  orden.forEach(sec => {
    const items = egresosJunio.filter(e => e.seccion === sec).sort((a,b) => b.importe - a.importe);
    const subtotal = items.reduce((s,i)=>s+i.importe,0);
    rows += '<tr><td colspan="3" style="background:var(--surface);font-weight:600;">' + sec + '</td></tr>';
    items.forEach(i => {
      rows += '<tr><td>' + i.desc + '</td><td style="color:var(--text-secondary);">' + i.sub + '</td><td style="text-align:right;">' + fmt2(i.importe) + '</td></tr>';
    });
    rows += '<tr><td colspan="2" style="font-weight:500;text-align:right;">Subtotal</td><td style="font-weight:500;text-align:right;">' + fmt2(subtotal) + '</td></tr>';
  });
  document.getElementById('subDetalle' + suffix).innerHTML =
    '<table><colgroup><col style="width:45%"><col style="width:30%"><col style="width:25%"></colgroup>' +
    '<thead><tr><th>Descripción</th><th>Subcategoría</th><th style="text-align:right;">Importe</th></tr></thead>' +
    '<tbody>' + rows + '</tbody>' +
    '<tfoot><tr><td colspan="2" style="font-weight:600;border-top:2px solid var(--border-strong);">Total egresos' + (isProm ? ' promedio mensual' : ' junio 2026') + '</td>' +
    '<td style="font-weight:600;text-align:right;border-top:2px solid var(--border-strong);">' + fmt2(kpisJunio.egresos_total) + '</td></tr></tfoot></table>' +
    '<p class="note" style="margin-top:10px;">30 partidas' + (isProm ? ' (detalle de junio, único mes con desglose completo; se usa como base del promedio mensual)' : '') + '. Incluye correcciones confirmadas: reflector LED x2, sillas de oficina x2; se retiraron "servicio de conexión de tarja" y el cargo sin desglose de gastos menores.</p>';

  let egresosHtml = '';
  orden.forEach(sec => {
    const items = egresosJunio.filter(e => e.seccion === sec);
    const sub = {};
    items.forEach(i => { sub[i.sub] = (sub[i.sub]||0) + i.importe; });
    const total = Object.values(sub).reduce((a,b)=>a+b,0);
    egresosHtml += sectionBar('Gastos de ' + sec, total);
    Object.entries(sub).sort((a,b)=>b[1]-a[1]).forEach(([label,value]) => { egresosHtml += rowLine(label, value, 12); });
  });
  let ingresosHtml = '';
  [...ingresosJunio].sort((a,b)=>b.value-a.value).forEach(i => { ingresosHtml += rowLine(i.label, i.value); });
  let cxcHtml = '<table style="margin-top:8px;"><colgroup><col style="width:60%"><col style="width:40%"></colgroup>' +
    '<thead><tr><th>Unidad</th><th style="text-align:right;">Adeudo</th></tr></thead><tbody>';
  cxcPorUnidadJunio.forEach(u => { cxcHtml += '<tr><td>' + u.unidad + '</td><td style="text-align:right;">' + fmt2(u.monto) + '</td></tr>'; });
  cxcHtml += '</tbody><tfoot><tr><td style="font-weight:600;border-top:2px solid var(--border-strong);">Total (22 unidades' + (isProm ? ', detalle de junio' : '') + ')</td>' +
    '<td style="font-weight:600;text-align:right;border-top:2px solid var(--border-strong);">' + fmt2(kpisJunio.cxc) + '</td></tr></tfoot></table>';
  let adelHtml = '';
  adelantadosTopJunio.forEach(a => { adelHtml += rowLine(a.unidad, a.monto); });

  document.getElementById('subEstado' + suffix).innerHTML =
    '<p style="font-weight:600;margin:0 0 2px;">Estado de flujo de efectivo</p>' +
    '<p class="note" style="margin:0 0 16px;">' + (isProm ? 'Promedio mensual — construido sobre el detalle de junio 2026 (único mes con cierre contable completo)' : 'Del 01 al 30 de junio 2026') + ' — Coto 10 Puerta Natura</p>' +
    (isProm ? '<div class="row-line" style="background:var(--surface);padding:6px 8px;border-radius:4px;margin-bottom:10px;"><span>Cuentas por cobrar — promedio 3 meses (mayo-julio)</span><span style="font-weight:600;">' + fmt2(cxcValue) + '</span></div>' +
      '<div class="row-line" style="background:var(--surface);padding:6px 8px;border-radius:4px;margin-bottom:10px;"><span>Adelantados — promedio 3 meses (mayo-julio)</span><span style="font-weight:600;">' + fmt2(adelValue) + '</span></div>' : '') +
    rowLine('Saldo inicial', kpisJunio.banco_inicial) +
    sectionBar('(+) Ingresos', kpisJunio.ingresos_total) + ingresosHtml +
    sectionBar('(-) Egresos', kpisJunio.egresos_total) + egresosHtml +
    highlightBar('(=) Saldo en bancos', kpisJunio.banco_final) +
    '<p class="section-label">Pendientes por pagar a proveedores</p>' +
    '<p style="font-size:12px;color:var(--text-secondary);">Confirmado: $0.00. No hay pagos pendientes a proveedores al cierre de junio 2026.</p>' +
    '<p class="section-label">Créditos diferidos / adelantados (top 5 de 47 unidades' + (isProm ? ', detalle de junio' : '') + ')</p>' +
    adelHtml + rowLine('Total adelantados (47 unidades' + (isProm ? ', detalle de junio' : '') + ')', kpisJunio.adelantados) +
    highlightBar('(=) Disponible a la fecha', kpisJunio.disponible_real) +
    '<p class="section-label">Cuentas por cobrar' + (isProm ? ' — detalle de junio 2026' : ' al 30 de junio 2026') + ' (22 unidades)</p>' +
    cxcHtml;

  const subPanels = { resumen: document.getElementById('subResumen' + suffix), detalle: document.getElementById('subDetalle' + suffix), estado: document.getElementById('subEstado' + suffix) };
  const subBtns = document.querySelectorAll('#subtabbar' + suffix + ' .subtab-btn');
  function showSub(name){
    Object.keys(subPanels).forEach(k => subPanels[k].style.display = (k === name) ? '' : 'none');
    subBtns.forEach(b => b.classList.toggle('active', b.dataset.sub === name));
  }
  subBtns.forEach(b => b.addEventListener('click', () => showSub(b.dataset.sub)));
  showSub('resumen');
}
buildMonthlyReport('panelJunio', 'Jun');
buildMonthlyReport('panelTodoJunioMount', 'Todo', {
  isPromedio: true,
  cxcValue: 54598.78,
  cxcLabel: 'Cuentas por cobrar (prom. 3m)',
  adelValue: 40130.82,
  adelLabel: 'Adelantados (prom. 3m)'
});

const monthPanels = { resumen: document.getElementById('panelResumenGeneral'), todo: document.getElementById('panelTodo'), balance: document.getElementById('panelBalance'), junio: document.getElementById('panelJunio'), julio: document.getElementById('panelJulio') };
const monthBtns = document.querySelectorAll('#monthTabs .tab-btn');
function showMonth(name){
  Object.keys(monthPanels).forEach(k => monthPanels[k].style.display = (k === name) ? '' : 'none');
  monthBtns.forEach(b => b.classList.toggle('active', b.dataset.month === name));
}
monthBtns.forEach(b => b.addEventListener('click', () => showMonth(b.dataset.month)));
showMonth('junio');
</script>
</body>
</html>
